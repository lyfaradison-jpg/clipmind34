<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipMind</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --primary: #00f0ff;
      --accent: #ff00ff;
      --bg: #0a0a1f;
      --card: #12122b;
      --text: #e0f0ff;
      --muted: #88aaff;
      --success: #22c55e;
      --danger: #ef4444;
    }
    body.light {
      --bg: #f0f4ff;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #64748b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* ── TOP BAR ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .menu-icon { font-size: 30px; cursor: pointer; color: var(--primary); line-height:1; }
    h1 {
      font-size: 30px;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #toggleMode {
      background: none;
      border: none;
      font-size: 26px;
      cursor: pointer;
      width: auto;
      padding: 4px 8px;
      margin: 0;
    }

    /* ── SIDE MENU ── */
    #sideMenu {
      position: fixed;
      top: 0; left: -320px;
      width: 280px;
      height: 100vh;
      background: var(--card);
      box-shadow: 4px 0 30px rgba(0,0,0,0.5);
      transition: left 0.35s cubic-bezier(.4,0,.2,1);
      z-index: 2000;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #sideMenu.open { left: 0; }
    #sideMenu h2 {
      margin: 0 0 16px;
      font-size: 22px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1999;
    }
    #overlay.show { display: block; }

    /* ── CARDS ── */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,240,255,0.1);
    }

    /* ── INPUTS ── */
    input, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid rgba(0,240,255,0.3);
      border-radius: 14px;
      font-size: 15px;
      margin-bottom: 12px;
      background: rgba(255,255,255,0.05);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      display: block;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    body.light input, body.light textarea { background: rgba(0,0,0,0.04); }

    /* ── BUTTONS ── */
    button {
      width: 100%;
      padding: 14px 16px;
      margin: 6px 0;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); opacity: 0.85; }
    .btn-primary { background: linear-gradient(90deg, var(--primary), var(--accent)); color: #fff; }
    .btn-image   { background: var(--accent); color: #fff; }
    .btn-danger  { background: var(--danger); color: #fff; }
    .btn-muted   { background: #475569; color: #fff; }

    /* ── CLIP CARDS ── */
    .clip {
      background: var(--card);
      border-radius: 18px;
      padding: 18px;
      margin: 14px 0;
      box-shadow: 0 6px 24px rgba(0,240,255,0.08);
      border: 1px solid rgba(0,240,255,0.07);
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; } }

    .clip-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .clip-meta small { color: var(--muted); font-size: 12px; }
    .clip-type-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .badge-text  { background: rgba(0,240,255,0.15); color: var(--primary); }
    .badge-image { background: rgba(255,0,255,0.15); color: var(--accent); }

    .clip-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .clip-text {
      white-space: pre-wrap;
      line-height: 1.65;
      margin: 8px 0;
      font-size: 14px;
      max-height: 120px;
      overflow: hidden;
      position: relative;
    }
    .clip-text.expanded { max-height: none; }
    .show-more {
      font-size: 12px;
      color: var(--primary);
      cursor: pointer;
      margin-top: 4px;
      display: inline-block;
      background: none;
      border: none;
      padding: 0;
      width: auto;
    }
    .clip img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 8px;
      display: block;
    }
    .clip-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .clip-actions button {
      flex: 1;
      padding: 10px 8px;
      font-size: 14px;
      margin: 0;
      border-radius: 12px;
    }

    /* ── TAG INPUT ── */
    .tag-row { display:flex; gap:8px; margin-bottom:12px; }
    .tag-row input { margin-bottom:0; flex:1; }
    .tag-row button { width:auto; padding:14px 18px; margin:0; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .tag {
      background: rgba(0,240,255,0.12);
      color: var(--primary);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .tag.active { background: var(--primary); color: #0a0a1f; }
    .tag.removable::after { content:'×'; margin-left:5px; }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(0,240,255,0.3);
      border-radius: 30px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      z-index: 9999;
      transition: transform 0.3s cubic-bezier(.4,0,.2,1);
      white-space: nowrap;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      opacity: 0.5;
    }
    .empty-state div { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; margin: 0; }

    /* ── SECTION HEADING ── */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--muted);
      margin: 20px 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── STATS BAR ── */
    .stats { display:flex; gap:14px; margin-bottom:20px; }
    .stat-chip {
      flex:1;
      background: var(--card);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,240,255,0.07);
    }
    .stat-chip .num {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-chip .lbl { font-size: 11px; color: var(--muted); margin-top:2px; }
  </style>
</head>
<body>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Overlay for side menu -->
  <div id="overlay" onclick="closeMenu()"></div>

  <!-- TOP BAR (hidden until unlocked) -->
  <div id="topBar" style="display:none" class="top-bar">
    <div class="menu-icon" onclick="toggleMenu()">☰</div>
    <h1>ClipMind</h1>
    <button id="toggleMode" title="Toggle theme">🌙</button>
  </div>

  <!-- SIDE MENU -->
  <div id="sideMenu">
    <h2>☰ ClipMind</h2>
    <button class="btn-primary" onclick="switchPage(0);closeMenu()">🏠 Home</button>
    <button class="btn-primary" onclick="switchPage(1);closeMenu()">🔍 Explore</button>
    <button class="btn-muted" onclick="showHelp();closeMenu()">❓ Help & Support</button>
    <button class="btn-danger" style="margin-top:auto" onclick="forgotPassword()">🗑️ Reset All Data</button>
  </div>

  <!-- PASSWORD SCREEN -->
  <div id="passwordScreen" class="card" style="max-width:420px;margin:60px auto 0">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:52px;margin-bottom:8px">🔐</div>
      <h2 style="margin:0;font-size:22px">Unlock ClipMind</h2>
      <p style="color:var(--muted);font-size:13px;margin:6px 0 0">Your clips are encrypted on this device</p>
    </div>
    <input type="password" id="masterPassword" placeholder="Enter master password" autocomplete="current-password">
    <button id="unlockBtn" class="btn-primary">Unlock</button>
    <button onclick="forgotPassword()" class="btn-danger" style="margin-top:4px;font-size:14px">Forgot Password? (Resets All Data)</button>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" style="display:none">

    <!-- HOME PAGE -->
    <div id="page0">
      <div class="stats">
        <div class="stat-chip">
          <div class="num" id="statTotal">0</div>
          <div class="lbl">Total</div>
        </div>
        <div class="stat-chip">
          <div class="num" id="statText">0</div>
          <div class="lbl">Text</div>
        </div>
        <div class="stat-chip">
          <div class="num" id="statImg">0</div>
          <div class="lbl">Images</div>
        </div>
      </div>

      <div class="card">
        <input type="text" id="clipLabel" placeholder="Label (optional)">
        <textarea id="clipInput" rows="4" placeholder="Paste or type text here..."></textarea>
        <div class="tag-row">
          <input type="text" id="tagInput" placeholder="Add tag (press Enter)">
          <button class="btn-primary" onclick="addPendingTag()" style="border-radius:12px">＋</button>
        </div>
        <div id="pendingTags" class="tags"></div>
        <button id="saveBtn" class="btn-primary">💾 Save Text Clip</button>
        <button id="screenshotBtn" class="btn-image">🖼️ Save Image / Screenshot</button>
      </div>

      <div class="section-title">Recent Clips</div>
      <div id="recentClips"></div>
    </div>

    <!-- EXPLORE PAGE -->
    <div id="page1" style="display:none">
      <div class="card">
        <input type="text" id="searchInput" placeholder="🔍 Search clips by text or tag...">
        <div id="filterTags" class="tags"></div>
      </div>
      <div id="searchResults"></div>
    </div>

  </div>

  <script>
    /* ───────────────────────────────────────────────
       STATE
    ─────────────────────────────────────────────── */
    let allClips = [];
    let masterPassword = '';
    let pendingTags = [];
    let activeFilterTag = null;
    let isLight = false;

    /* ───────────────────────────────────────────────
       CRYPTO
    ─────────────────────────────────────────────── */
    async function getKey(pw) {
      const enc = new TextEncoder();
      const keyMat = await crypto.subtle.importKey(
        "raw", enc.encode(pw), "PBKDF2", false, ["deriveBits","deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name:"PBKDF2", salt:enc.encode("clipmind-salt-v1"), iterations:100000, hash:"SHA-256" },
        keyMat,
        { name:"AES-GCM", length:256 },
        true, ["encrypt","decrypt"]
      );
    }

    async function saveEncrypted() {
      const key = await getKey(masterPassword);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt(
        { name:"AES-GCM", iv },
        key,
        new TextEncoder().encode(JSON.stringify(allClips))
      );
      localStorage.setItem('encryptedClips', JSON.stringify({
        iv: Array.from(iv),
        data: Array.from(new Uint8Array(encrypted))
      }));
    }

    async function loadClips() {
      const stored = localStorage.getItem('encryptedClips');
      if (!stored) return; // first use – no data yet, that's fine
      const enc = JSON.parse(stored);
      const key = await getKey(masterPassword);
      const decrypted = await crypto.subtle.decrypt(
        { name:"AES-GCM", iv: new Uint8Array(enc.iv) },
        key,
        new Uint8Array(enc.data)
      );
      allClips = JSON.parse(new TextDecoder().decode(decrypted));
    }

    /* ───────────────────────────────────────────────
       AUTH
    ─────────────────────────────────────────────── */
    document.getElementById('unlockBtn').addEventListener('click', unlock);
    document.getElementById('masterPassword').addEventListener('keydown', e => {
      if (e.key === 'Enter') unlock();
    });

    async function unlock() {
      const pw = document.getElementById('masterPassword').value.trim();
      if (!pw) { toast('Enter a password'); return; }
      masterPassword = pw;
      try {
        await loadClips();
        document.getElementById('passwordScreen').style.display = 'none';
        document.getElementById('topBar').style.display = 'flex';
        document.getElementById('mainApp').style.display = 'block';
        switchPage(0);
      } catch(e) {
        toast("Wrong password – try again or reset", true);
        masterPassword = '';
      }
    }

    function forgotPassword() {
      if (confirm("This will permanently delete ALL your clips. Are you sure?")) {
        localStorage.clear();
        location.reload();
      }
    }

    /* ───────────────────────────────────────────────
       THEME
    ─────────────────────────────────────────────── */
    document.getElementById('toggleMode').addEventListener('click', () => {
      isLight = !isLight;
      document.body.classList.toggle('light', isLight);
      document.getElementById('toggleMode').textContent = isLight ? '☀️' : '🌙';
      localStorage.setItem('clipmind-theme', isLight ? 'light' : 'dark');
    });

    /* ───────────────────────────────────────────────
       MENU
    ─────────────────────────────────────────────── */
    function toggleMenu() {
      const m = document.getElementById('sideMenu');
      const o = document.getElementById('overlay');
      const open = m.classList.toggle('open');
      o.classList.toggle('show', open);
    }
    function closeMenu() {
      document.getElementById('sideMenu').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    }

    /* ───────────────────────────────────────────────
       PAGES
    ─────────────────────────────────────────────── */
    function switchPage(page) {
      document.getElementById('page0').style.display = page === 0 ? 'block' : 'none';
      document.getElementById('page1').style.display = page === 1 ? 'block' : 'none';
      if (page === 0) renderRecent();
      if (page === 1) { renderFilterTags(); renderExplore(); }
    }

    /* ───────────────────────────────────────────────
       STATS
    ─────────────────────────────────────────────── */
    function updateStats() {
      const texts  = allClips.filter(c => c.text).length;
      const images = allClips.filter(c => c.data).length;
      document.getElementById('statTotal').textContent = allClips.length;
      document.getElementById('statText').textContent  = texts;
      document.getElementById('statImg').textContent   = images;
    }

    /* ───────────────────────────────────────────────
       TAGS (pending on add form)
    ─────────────────────────────────────────────── */
    document.getElementById('tagInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); addPendingTag(); }
    });

    function addPendingTag() {
      const val = document.getElementById('tagInput').value.trim().toLowerCase();
      if (!val || pendingTags.includes(val)) return;
      pendingTags.push(val);
      document.getElementById('tagInput').value = '';
      renderPendingTags();
    }

    function renderPendingTags() {
      const el = document.getElementById('pendingTags');
      el.innerHTML = '';
      pendingTags.forEach(t => {
        const span = document.createElement('span');
        span.className = 'tag removable';
        span.textContent = t;
        span.onclick = () => {
          pendingTags = pendingTags.filter(x => x !== t);
          renderPendingTags();
        };
        el.appendChild(span);
      });
    }

    /* ───────────────────────────────────────────────
       SAVE TEXT CLIP
    ─────────────────────────────────────────────── */
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const text  = document.getElementById('clipInput').value.trim();
      const label = document.getElementById('clipLabel').value.trim();
      if (!text) { toast('Enter some text first'); return; }
      const tags = [...pendingTags];
      allClips.unshift({ text, label, tags, date: Date.now() });
      pendingTags = [];
      renderPendingTags();
      await saveEncrypted();
      document.getElementById('clipInput').value = '';
      document.getElementById('clipLabel').value = '';
      toast('✅ Clip saved!');
      renderRecent();
    });

    /* ───────────────────────────────────────────────
       SAVE IMAGE CLIP
    ─────────────────────────────────────────────── */
    document.getElementById('screenshotBtn').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const label = document.getElementById('clipLabel').value.trim();
        const tags  = [...pendingTags];
        const reader = new FileReader();
        reader.onload = async ev => {
          allClips.unshift({ data: ev.target.result, label, tags, date: Date.now() });
          pendingTags = [];
          renderPendingTags();
          document.getElementById('clipLabel').value = '';
          await saveEncrypted();
          toast('🖼️ Image saved!');
          renderRecent();
        };
        reader.readAsDataURL(file);
      };
      input.click();
    });

    /* ───────────────────────────────────────────────
       RENDER HELPERS
    ─────────────────────────────────────────────── */
    function buildClipEl(clip, originalIndex) {
      const div = document.createElement('div');
      div.className = 'clip';

      const badgeClass = clip.text ? 'badge-text' : 'badge-image';
      const badgeLabel = clip.text ? 'TEXT' : 'IMAGE';

      const metaHtml = `
        <div class="clip-meta">
          <span class="clip-type-badge ${badgeClass}">${badgeLabel}</span>
          <small>${new Date(clip.date).toLocaleString()}</small>
        </div>
      `;

      const labelHtml = clip.label
        ? `<div class="clip-label">🏷 ${escHtml(clip.label)}</div>`
        : '';

      const tagsHtml = (clip.tags && clip.tags.length)
        ? `<div class="tags" style="margin-bottom:8px">${clip.tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}</div>`
        : '';

      let contentHtml = '';
      if (clip.text) {
        const needsExpand = clip.text.length > 300;
        const uid = 'ct' + originalIndex + Date.now();
        contentHtml = `
          <p class="clip-text" id="${uid}">${escHtml(clip.text)}</p>
          ${needsExpand ? `<button class="show-more" onclick="toggleExpand('${uid}', this)">Show more ▼</button>` : ''}
        `;
      } else {
        contentHtml = `<img src="${clip.data}" alt="${clip.label || 'Saved image'}" loading="lazy">`;
      }

      const copyBtn = clip.text
        ? `<button onclick="copyClip(${originalIndex})" style="background:#22c55e;color:#fff">📋 Copy</button>`
        : `<button onclick="copyImageToClipboard(${originalIndex})" style="background:#22c55e;color:#fff">📋 Copy Image</button>`;

      div.innerHTML = `
        ${metaHtml}
        ${labelHtml}
        ${tagsHtml}
        ${contentHtml}
        <div class="clip-actions">
          ${copyBtn}
          <button onclick="deleteClip(${originalIndex})" style="background:#ef4444;color:#fff">🗑️ Delete</button>
        </div>
      `;
      return div;
    }

    function toggleExpand(id, btn) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.toggle('expanded');
      btn.textContent = el.classList.contains('expanded') ? 'Show less ▲' : 'Show more ▼';
    }
    window.toggleExpand = toggleExpand;

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    /* ───────────────────────────────────────────────
       RECENT
    ─────────────────────────────────────────────── */
    function renderRecent() {
      updateStats();
      const container = document.getElementById('recentClips');
      container.innerHTML = '';
      const recent = allClips.slice(0, 10);
      if (recent.length === 0) {
        container.innerHTML = `<div class="empty-state"><div>📭</div><p>No clips yet. Paste something above!</p></div>`;
        return;
      }
      recent.forEach((clip, i) => container.appendChild(buildClipEl(clip, i)));
    }

    /* ───────────────────────────────────────────────
       EXPLORE / SEARCH
    ─────────────────────────────────────────────── */
    function renderFilterTags() {
      const allTags = [...new Set(allClips.flatMap(c => c.tags || []))];
      const el = document.getElementById('filterTags');
      el.innerHTML = '';
      allTags.forEach(t => {
        const span = document.createElement('span');
        span.className = 'tag' + (t === activeFilterTag ? ' active' : '');
        span.textContent = t;
        span.onclick = () => {
          activeFilterTag = activeFilterTag === t ? null : t;
          renderFilterTags();
          filterClips(document.getElementById('searchInput').value);
        };
        el.appendChild(span);
      });
    }

    function renderExplore() {
      const input = document.getElementById('searchInput');
      // remove old listener cleanly
      input.oninput = () => filterClips(input.value);
      filterClips(input.value);
    }

    function filterClips(term) {
      const container = document.getElementById('searchResults');
      container.innerHTML = '';
      const q = term.trim().toLowerCase();

      const filtered = allClips
        .map((clip, originalIndex) => ({ clip, originalIndex }))
        .filter(({ clip }) => {
          const matchText = !q || (clip.text || '').toLowerCase().includes(q) || (clip.label || '').toLowerCase().includes(q);
          const matchTag = !activeFilterTag || (clip.tags || []).includes(activeFilterTag);
          return matchText && matchTag;
        });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state"><div>🔍</div><p>No clips match your search</p></div>`;
        return;
      }

      filtered.forEach(({ clip, originalIndex }) => {
        container.appendChild(buildClipEl(clip, originalIndex));
      });
    }

    /* ───────────────────────────────────────────────
       CLIP ACTIONS
    ─────────────────────────────────────────────── */
    window.copyClip = (i) => {
      const text = allClips[i]?.text;
      if (!text) return;
      navigator.clipboard.writeText(text)
        .then(() => toast('📋 Copied to clipboard!'))
        .catch(() => toast('Copy failed – try manually', true));
    };

    window.copyImageToClipboard = async (i) => {
      const clip = allClips[i];
      if (!clip?.data) return;
      try {
        const res  = await fetch(clip.data);
        const blob = await res.blob();
        await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
        toast('🖼️ Image copied!');
      } catch {
        toast('Image copy not supported – right-click to save', true);
      }
    };

    window.deleteClip = async (i) => {
      if (!confirm("Delete this clip?")) return;
      allClips.splice(i, 1);
      await saveEncrypted();
      toast('🗑️ Deleted');
      // re-render whichever page is visible
      const onExplore = document.getElementById('page1').style.display !== 'none';
      if (onExplore) { renderFilterTags(); filterClips(document.getElementById('searchInput').value); }
      else renderRecent();
    };

    /* ───────────────────────────────────────────────
       TOAST
    ─────────────────────────────────────────────── */
    let toastTimer;
    function toast(msg, isError = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.borderColor = isError ? 'rgba(239,68,68,0.5)' : 'rgba(0,240,255,0.3)';
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    /* ───────────────────────────────────────────────
       HELP
    ─────────────────────────────────────────────── */
    window.showHelp = () => alert(
      "ClipMind Help\n\n" +
      "• Save text, screenshots, or any image\n" +
      "• Add labels and tags for easy searching\n" +
      "• All data is encrypted on your device only\n" +
      "• Your password is never stored — don't forget it!\n\n" +
      "Support: lyfaradison@gmail.com"
    );

    /* ───────────────────────────────────────────────
       INIT
    ─────────────────────────────────────────────── */
    window.onload = () => {
      // restore theme
      if (localStorage.getItem('clipmind-theme') === 'light') {
        isLight = true;
        document.body.classList.add('light');
        document.getElementById('toggleMode').textContent = '☀️';
      }
      document.getElementById('masterPassword').focus();
    };
  </script>
</body>
</html>
